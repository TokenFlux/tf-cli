name: release

# 打 tag 即发版：git tag v0.1.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.1.0）"
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # 手动触发时 github.ref 是用户选择的分支，不是输入框里的 tag。
      # 所有 job 都必须显式检出同一个 tag，避免旧 tag 装进 main HEAD 的二进制。
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: 发版前检查
        run: |
          set -eu
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi
          go vet ./...
          go test ./...
          make shell-test
          make npm-test
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          bash scripts/release-notes.sh "$TAG" > /dev/null

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          # Windows 原生交互由 CI 的 windows-latest 和 ConPTY 测试覆盖。
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 确定版本号
        id: v
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "commit=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      # 依赖均支持纯 Go 交叉编译，产物不需要 cgo。
      - name: 编译
        id: compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          name="tf"
          [ "$GOOS" = windows ] && name="tf.exe"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/tokenflux/tf-cli/internal/buildinfo.Version=${{ steps.v.outputs.version }} \
              -X github.com/tokenflux/tf-cli/internal/buildinfo.Commit=${{ steps.v.outputs.commit }}" \
            -o "dist/$name" ./cmd/tf
          echo "binary=dist/$name" >> "$GITHUB_OUTPUT"

      # 归档名要与 internal/update 里的推导规则严格一致，否则自更新会找不到文件。
      - name: 打包
        id: pack
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          base="tf_${{ steps.v.outputs.version }}_${GOOS}_${GOARCH}"
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -q "../$base.zip" tf.exe
            echo "asset=$base.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "../$base.tar.gz" tf
            echo "asset=$base.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.asset }}
          path: ${{ steps.pack.outputs.asset }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.compile.outputs.binary }}
          if-no-files-found: error

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: dist/npm-binaries

      - name: 准备 npm 包
        run: |
          set -eu
          npm install --global npm@11.19.0 pnpm@9.15.9
          version=${TAG#v}
          node scripts/build-npm-packages.mjs "$version" dist/npm-binaries dist/npm
          node scripts/check-npm-packages.mjs dist/npm --require-pnpm

      - name: 发布 npm 包
        run: node scripts/publish-npm-packages.mjs dist/npm --provenance

  release:
    needs: [build, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: tf_*
          path: staging
          merge-multiple: true

      - name: 汇总校验和
        run: |
          set -eu
          cd staging
          sha256sum tf_* > SHA256SUMS
          cat SHA256SUMS

      # gh CLI 在 runner 上自带，不引第三方 action。
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          # 说明由两段拼成：
          #
          #   --notes-file     手写部分（变更记录 + 下载指引 + 校验）
          #   --generate-notes GitHub 追加「What's Changed」与完整变更链接
          #
          # 自动部分按合并的 PR 组织，直推 main 时通常只有比较链接；
          # 手写部分负责解释用户能看到的变化。两段缺一不可。
          bash scripts/release-notes.sh "$TAG" > /tmp/notes.md
          gh release create "$TAG" staging/* \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --generate-notes \
            --verify-tag
