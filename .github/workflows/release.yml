name: release

# 打 tag 即发版：git tag v0.1.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.1.0）"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          # Windows v0 标注实验性：能编译，但交互路径未验证。
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 发布必须先过自检。
      #
      # 之前 release 与 ci 是两条独立流水线：一个编译不过的提交打上 tag
      # 就直接发了产物出去，而 ci 那边正红着。产物本身能跑 —— 坏的是测试，
      # 不是代码 —— 但这条路同样能放过真正坏掉的代码。
      - name: 自检
        run: go vet ./... && go test ./...

      - name: 确定版本号
        id: v
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # 交叉编译不需要 cgo，也不需要第三方 action —— 项目本身零依赖。
      - name: 编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          name="tf"
          [ "$GOOS" = windows ] && name="tf.exe"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/tokenflux/tkr/internal/buildinfo.Version=${{ steps.v.outputs.version }} \
              -X github.com/tokenflux/tkr/internal/buildinfo.Commit=${GITHUB_SHA::7}" \
            -o "dist/$name" ./cmd/tf

      # 归档名要与 internal/update 里的推导规则严格一致，否则自更新会找不到文件。
      - name: 打包
        id: pack
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          base="tf_${{ steps.v.outputs.version }}_${GOOS}_${GOARCH}"
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -q "../$base.zip" tf.exe
            echo "asset=$base.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "../$base.tar.gz" tf
            echo "asset=$base.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.asset }}
          path: ${{ steps.pack.outputs.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: 汇总校验和
        run: |
          set -eu
          cd staging
          sha256sum tf_* > SHA256SUMS
          cat SHA256SUMS

      # gh CLI 在 runner 上自带，不引第三方 action。
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          # 发布说明从 CHANGELOG.md 取，不用 --generate-notes：
          # 后者按合并的 PR 生成，而这个仓库全是直推 main，
          # v0.1.0 到 v0.4.0 四个版本的说明都只有一行链接。
          #
          # 取不到就失败，不退回自动生成：忘了写变更记录应当拦住发布，
          # 而不是静默地发出一个没人看得懂的版本。
          bash scripts/release-notes.sh "$TAG" > /tmp/notes.md
          gh release create "$TAG" staging/* \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --verify-tag
